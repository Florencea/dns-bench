{{define "layout"}}<!DOCTYPE html>
<html lang="{{.Lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.T.AppTitle}}</title>
  <link rel="icon" href="/static/dns-icon.svg" type="image/svg+xml">
  <link rel="icon" href="/static/favicon.ico" sizes="any">
  <link rel="stylesheet" href="/static/bootstrap.min.css">
</head>
<body class="bg-light">
  <header class="navbar bg-white border-bottom px-3 py-2">
    <div class="container-fluid px-0">
      <h1 class="h5 mb-0 fw-semibold">
        <a class="text-decoration-none text-dark d-inline-flex align-items-center gap-2" href="/">
          <img src="/static/dns-icon.svg" alt="" width="24" height="24" class="d-inline-block align-text-top">
          <span>{{.T.AppTitle}}</span>
        </a>
      </h1>
      <form method="POST" action="/locale" class="d-inline">
        <input type="hidden" name="locale" value="{{.SwitchLocale}}">
        <input type="hidden" name="next" value="{{.CurrentURI}}">
        <button type="submit" class="btn btn-outline-secondary btn-sm">{{.T.UI.ChangeLanguage}}</button>
      </form>
    </div>
  </header>

  <main class="py-4">
    <div class="container-fluid">
      {{template "content" .}}
    </div>
  </main>
</body>
</html>
{{end}}
